title: Digital Trace Data
logo: /assets/img/logo.png
description: "Introduction to digital trace data: Quality, ethics, and analysis. Utrecht University"
show_downloads: false
theme: jekyll-theme-minimal
repository: digitalTraceData/digitalTraceData.github.io

# Publish only the lab 1 data download from the otherwise excluded materials.
include:
  - ddp_twitter_soda.zip

exclude:
  - LICENSE
  - README.md
  - index.html
  - "materials/*.*"
  - "materials/**/*"
  - run.sh
  - vendor
  - .bundle
  - node_modules
  - .github

plugins:
  - jekyll-seo-tag
